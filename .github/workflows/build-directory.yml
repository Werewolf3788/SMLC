# Rebuilds directory.html from Firestore (directory/public) every hour, so the
# business cards, quick answers and schema are baked into the page for Google and
# AI crawlers. GitHub only runs scheduled workflows from the DEFAULT branch (main),
# so this file must also be copied to main to run on its own; it builds and
# commits to the Claude-Test branch.
name: Build Business Directory page

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Claude-Test
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Build directory.html
        run: node scripts/build-directory.mjs
      - name: Commit if changed
        run: |
          git config user.name "smlc-directory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add directory.html data/directory.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Directory: rebuild from Firestore"
          git push origin HEAD:Claude-Test
