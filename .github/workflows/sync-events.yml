name: Sync SMLC Calendar iCal to Firestore

on:
  schedule:
    # Runs every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual run button in GitHub UI
  push:
    branches:
      - main
    paths:
      - 'events/**' # Triggers automatically when anything in the events folder changes

jobs:
  sync-calendar:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./events

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run iCal Sync Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node sync-ical.js
