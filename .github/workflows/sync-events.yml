name: Sync SMLC Calendar iCal to Firestore

on:
  schedule:
    # Runs every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'events/**'

jobs:
  sync-calendar:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./events

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Run iCal Sync Script
        env:
          RAW_FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$RAW_FIREBASE_SECRET" > /tmp/gcp_key.json
          node sync-ical.js
          rm -f /tmp/gcp_key.json
