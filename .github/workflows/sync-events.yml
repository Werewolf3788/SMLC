name: Sync SMLC Calendar iCal to Firestore

on:
  schedule:
    # Runs every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'events/**'

jobs:
  sync-calendar:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./events

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Decode Key & Run Sync Script
        env:
          FIREBASE_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node -e 'fs.writeFileSync("/tmp/gcp_key.json", Buffer.from(process.env.FIREBASE_BASE64.trim(), "base64").toString("utf8"))'
          node sync-ical.js
          rm -f /tmp/gcp_key.json
