name: Sync SMLC Calendar iCal to Firestore

on:
  schedule:
    # Runs every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'events/**'

jobs:
  sync-calendar:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./events

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Run iCal Sync Script
        env:
          FIREBASE_KEY_ID: ${{ secrets.FIREBASE_KEY_ID }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: node sync-ical.js
