# Tells Bing, Yandex, Seznam, Naver (and the AI answer tools that read Bing) right away
# when SMLC pages change, using IndexNow. Google does not use IndexNow; it reads sitemap.xml.
# Runs by itself on every push to main that changes a web page or sitemap.xml.
# The key file 1281c43a4c58737ba44a202409aef432.txt sits in the site root; nothing to set up.
name: Ping search engines (IndexNow)

on:
  push:
    branches: [main]
    paths: ['**.html', 'sitemap.xml']
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Send changed pages to IndexNow
        run: |
          HOST=supportmylocalcommunity.com
          KEY=1281c43a4c58737ba44a202409aef432
          # Changed pages in this push; if none can be worked out, send everything in sitemap.xml
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- '*.html' 2>/dev/null | grep -v '^admin/\|^test/\|^wordpress/' || true)
          if [ -n "$CHANGED" ]; then
            URLS=$(echo "$CHANGED" | sed -e 's#^index.html$##' -e 's#/index.html$#/#' -e "s#^#https://$HOST/#")
          else
            URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's#</\?loc>##g')
          fi
          echo "$URLS"
          LIST=$(echo "$URLS" | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          curl -sS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":$LIST}" \
            -w '\nIndexNow answered HTTP %{http_code}\n'
