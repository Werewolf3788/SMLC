name: fetch product picture
on:
  push:
    branches: [Claude-Test]
permissions:
  contents: write
jobs:
  fetch:
    if: contains(github.event.head_commit.message, 'fetch reese picture')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and convert
        run: |
          curl -fsSL -A 'Mozilla/5.0' -o /tmp/p.png 'https://i5.walmartimages.com/seo/Reese-s-Peanut-Butter-Filled-Pretzels-18-oz-Sharing-Size_59f67a0c-c92e-4454-8bc6-f5a1dc505ace.92e678f95792db7048c76cbc68f68ff6.png?odnHeight=400&odnWidth=400&odnBg=FFFFFF'
          mkdir -p images/barcode
          if command -v convert >/dev/null 2>&1; then
            convert /tmp/p.png -background white -flatten -quality 88 images/barcode/810031480326.jpg
          elif command -v magick >/dev/null 2>&1; then
            magick /tmp/p.png -background white -flatten -quality 88 images/barcode/810031480326.jpg
          else
            python3 -m pip install --quiet pillow
            python3 -c "from PIL import Image; Image.open('/tmp/p.png').convert('RGB').save('images/barcode/810031480326.jpg','JPEG',quality=88)"
          fi
          file images/barcode/810031480326.jpg
      - name: Commit picture and remove helper
        run: |
          git config user.name 'SMLC bot'
          git config user.email 'bot@users.noreply.github.com'
          git rm -q .github/workflows/fetch-product-picture.yml
          git add images/barcode/810031480326.jpg
          git commit -m "Inventory: add the Reese's pretzels picture"
          git push origin HEAD:Claude-Test
