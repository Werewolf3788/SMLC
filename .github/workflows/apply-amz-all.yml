# Temporary helper: applies the gzipped patch in ci/change5.b64, checks it landed, then removes both files.
# It only runs for a commit whose message says APPLY-AMZ-ALL-PATCH.
name: Apply site-wide Amazon tag patch

on:
  push:
    branches: [Claude-Test]

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'APPLY-AMZ-ALL-PATCH')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Claude-Test
          fetch-depth: 0
      - name: Apply patch
        run: |
          base64 -d ci/change5.b64 | gunzip > /tmp/change.patch
          git apply --whitespace=nowarn /tmp/change.patch
          test -f smlc-amazon-tag.js
          test "$(grep -l 'smlc-amazon-tag.js' *.html admin/*.html full/*.html test/*.html inventory/*.html | wc -l)" = "24"
          git rm -q ci/change5.b64 .github/workflows/apply-amz-all.yml
          git add -A
          git config user.name "SMLC bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Amazon links: one shared tag file used by every SMLC page"
          git push origin HEAD:Claude-Test
