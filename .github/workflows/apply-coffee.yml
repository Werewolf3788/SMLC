name: apply-coffee
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'SMLC bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Add Buy me a coffee link to every SMLC page
        run: |
          set -e
          cat > smlc-coffee.js <<'JS'
          /* ==========================================================================
             File: smlc-coffee.js  |  2026-11-25
             Load this in the <head> of every SMLC public page.

             COFFEE LINK: shows a small "Buy me a coffee" button in the bottom-left
             corner of the page. It opens https://buymeacoffee.com/raykevin71b in a new
             tab. The button sits on the left because the "back to top" button already
             lives in the bottom-right corner of the town pages.
             ========================================================================== */
          (function () {
              'use strict';
              if (window.smlcCoffee) return;             // already loaded on this page
              window.smlcCoffee = true;

              var COFFEE_URL = 'https://buymeacoffee.com/raykevin71b';

              function build() {
                  if (document.getElementById('smlc-coffee-link') || !document.body) return;
                  var a = document.createElement('a');
                  a.id = 'smlc-coffee-link';
                  a.href = COFFEE_URL;
                  a.target = '_blank';
                  a.rel = 'noopener';
                  a.title = 'Buy me a coffee';
                  a.setAttribute('aria-label', 'Buy me a coffee - opens Buy Me a Coffee in a new tab');
                  a.style.cssText = [
                      'position:fixed',
                      'left:14px',
                      'bottom:calc(14px + env(safe-area-inset-bottom, 0px))',
                      'z-index:800',
                      'display:inline-flex',
                      'align-items:center',
                      'gap:7px',
                      'padding:9px 14px',
                      'border-radius:999px',
                      'background:#ffffff',
                      'color:#222222',
                      'border:1px solid rgba(0,0,0,.15)',
                      'box-shadow:0 3px 12px rgba(0,0,0,.18)',
                      'font:600 13px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',
                      'text-decoration:none',
                      'white-space:nowrap'
                  ].join(';');

                  var cup = document.createElement('span');
                  cup.setAttribute('aria-hidden', 'true');
                  cup.textContent = '\u2615';
                  cup.style.cssText = 'font-size:16px;line-height:1';

                  var label = document.createElement('span');
                  label.textContent = 'Buy me a coffee';

                  a.appendChild(cup);
                  a.appendChild(label);
                  document.body.appendChild(a);
              }

              if (document.readyState === 'loading') {
                  document.addEventListener('DOMContentLoaded', build);
              } else {
                  build();
              }
          })();
          JS
          node --check smlc-coffee.js
          cat > /tmp/insert.js <<'JS'
          const fs = require('fs');
          const files = ['index.html','flora.html','clay-city.html','louisville.html','sailor-springs.html','xenia.html','directory.html','gallery.html','install.html','tct.html','update-gas.html','share-photos.html','inventory/index.html','full/flora.html','full/clay-city.html','full/sailor-springs.html','full/louisville.html'];
          let changed = 0;
          for (const f of files) {
            let s = fs.readFileSync(f, 'utf8');
            if (s.includes('smlc-coffee.js')) continue;
            s = s.replace(/^([ \t]*)<script src="((?:\.\.\/)?)smlc-amazon-tag\.js"><\/script>[ \t]*$/m, function (m, indent, prefix) {
              return m + '\n' + indent + '<script src="' + prefix + 'smlc-coffee.js"></script>';
            });
            if (!s.includes('smlc-coffee.js')) throw new Error('no place to add the tag in ' + f);
            fs.writeFileSync(f, s);
            changed++;
          }
          console.log('pages updated:', changed);
          JS
          node /tmp/insert.js
          grep -qF 'smlc-coffee.js' index.html
          grep -qF 'smlc-coffee.js' inventory/index.html
          grep -qF 'smlc-coffee.js' full/flora.html
          grep -qF 'buymeacoffee.com/raykevin71b' smlc-coffee.js
          git config user.name "SMLC bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -q .github/workflows/apply-coffee.yml
          git add -A
          git commit -m "Support: one Buy me a coffee link on every SMLC page"
          git push origin HEAD:${{ github.ref_name }}