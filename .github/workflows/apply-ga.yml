# Temporary helper: applies the gzipped patch in ci/change6.b64, checks it landed, then removes both files.
# It only runs for a commit whose message says APPLY-GA-PATCH.
name: Apply SMLC analytics patch

on:
  push:
    branches: [Claude-Test]

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'APPLY-GA-PATCH')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Claude-Test
          fetch-depth: 0
      - name: Apply patch
        run: |
          base64 -d ci/change6.b64 | gunzip > /tmp/change.patch
          git apply --whitespace=nowarn /tmp/change.patch
          test "$(grep -rl 'G-FHJNXDB9BB' *.html admin/*.html full/*.html test/*.html inventory/*.html | wc -l)" = "24"
          test -z "$(grep -rho 'G-[A-Z0-9]\{8,\}' --include='*.html' --include='*.js' . | grep -v G-FHJNXDB9BB)"
          git rm -q ci/change6.b64 .github/workflows/apply-ga.yml
          git add -A
          git config user.name "SMLC bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Analytics: every SMLC page sends to G-FHJNXDB9BB only"
          git push origin HEAD:Claude-Test
