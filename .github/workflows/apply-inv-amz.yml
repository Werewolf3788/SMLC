# Temporary helper: applies the gzipped patch in ci/change4.b64, checks it landed, then removes both files.
# It only runs for a commit whose message says APPLY-INV-AMZ-PATCH.
name: Apply inventory Amazon-link patch

on:
  push:
    branches: [Claude-Test]

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'APPLY-INV-AMZ-PATCH')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Claude-Test
          fetch-depth: 0
      - name: Apply patch
        run: |
          base64 -d ci/change4.b64 | gunzip > /tmp/change.patch
          git apply --whitespace=nowarn /tmp/change.patch
          grep -q 'most of these can be bought at Amazon too' inventory/index.html
          git rm -q ci/change4.b64 .github/workflows/apply-inv-amz.yml
          git add -A
          git config user.name "SMLC bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Inventory: store links know their store, Amazon links carry the SMLC tag"
          git push origin HEAD:Claude-Test
