# Temporary helper: applies the gzipped patch in ci/change.b64 to this branch, then deletes both files.
# It only runs for a commit whose message says APPLY-INV-LINK-PATCH.
name: Apply inventory store-link patch

on:
  push:
    branches: [Claude-Test]

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'APPLY-INV-LINK-PATCH')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Claude-Test
          fetch-depth: 0
      - name: Apply patch
        run: |
          set -e
          base64 -d ci/change.b64 | gunzip > /tmp/change.patch
          git apply --whitespace=nowarn /tmp/change.patch
          git rm -q ci/change.b64 .github/workflows/apply-inv-link.yml
          git config user.name "SMLC bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Inventory: one store page link per product, remembered on the barcode"
          git push origin HEAD:Claude-Test
