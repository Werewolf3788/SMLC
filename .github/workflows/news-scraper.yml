name: Scheduled Local News Scraper Pipeline

on:
  schedule:
    # Runs every hour at minute 0 (00:00, 01:00, 02:00, etc. UTC)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions UI

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install firebase rss-parser cheerio

      - name: Run Scraper
        run: node local-news/News.js
