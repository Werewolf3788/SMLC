name: Apply inventory ownership fields
# Temporary one-off helper: applies ci/inventory-ownership.patch, then delete both files.
on:
  push:
    paths:
      - '.github/workflows/apply-inventory-ownership.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-inventory-ownership
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply the change
        run: git apply --whitespace=nowarn ci/inventory-ownership.patch
      - name: Commit and push
        run: |
          git config user.name "smlc-merge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add inventory/index.html apps-script/ProductLookup.gs
          if git diff --cached --quiet; then echo "nothing to change"; exit 0; fi
          git commit -m "Inventory: non-food items keep a purchase date+time and serial number"
          git push origin HEAD:${{ github.ref_name }}
