# Temporary helper (v3): applies the gzipped patch in ci/change3.b64, checks it landed, then removes
# every helper file and commits. It only runs for a commit message that says APPLY-INV-LINK-PATCH3.
name: Apply inventory store-link patch (v3)

on:
  push:
    branches: [Claude-Test]

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'APPLY-INV-LINK-PATCH3')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Claude-Test
          fetch-depth: 0
      - name: Apply patch
        run: |
          base64 -d ci/change3.b64 | gunzip > /tmp/change.patch
          git apply --whitespace=nowarn /tmp/change.patch
          grep -q 'saved for this barcode' inventory/index.html
          git rm -q ci/change2.b64 ci/change3.b64 .github/workflows/apply-inv-link2.yml .github/workflows/apply-inv-link3.yml
          git add -A
          git config user.name "SMLC bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Inventory: one store page link per product, remembered on the barcode"
          git push origin HEAD:Claude-Test
