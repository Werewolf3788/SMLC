name: apply-inv-pic-patch
on:
  push:
    branches: [Claude-Test]
jobs:
  apply:
    if: contains(github.event.head_commit.message, 'APPLY-INV-PIC-PATCH')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Claude-Test
      - name: Apply the change
        run: |
          set -e
          base64 -d ci/change.b64 | gunzip > /tmp/change.patch
          git apply --verbose /tmp/change.patch
          git config user.name "smlc-bot"
          git config user.email "actions@github.com"
          git rm -q ci/change.b64 .github/workflows/apply-pic-patch.yml
          git add inventory/index.html
          git commit -m "Inventory: tap a product picture to see it big"
          git push origin HEAD:Claude-Test
