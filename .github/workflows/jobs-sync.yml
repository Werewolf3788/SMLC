name: Now Hiring Jobs Sync

on:
  schedule:
    # Twice a day: 6:17 AM and 6:17 PM Central (11:17 and 23:17 UTC)
    - cron: '17 11,23 * * *'
  workflow_dispatch: # Run it any time from the Actions tab

jobs:
  sync-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm install firebase

      - name: Pull jobs from Adzuna
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: node jobs/jobs-sync.js
